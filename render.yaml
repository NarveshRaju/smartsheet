services:
  # Fullstack Web Service (Express API + React Dashboard)
  - type: web
    name: smartsheet-gcal-sync
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build && npm run db:push
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smartsheet-gcal-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SMARTSHEET_CLIENT_ID
        sync: false
      - key: SMARTSHEET_CLIENT_SECRET
        sync: false
      - key: SMARTSHEET_REDIRECT_URI
        sync: false
      - key: WEBHOOK_CALLBACK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: smartsheet-gcal-db
    plan: free
    databaseName: smartsheet_gcal_sync
    user: smartsheet_user
